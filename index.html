<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XDzZyq | Home</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body class="layout">
    <main class="main">
        <div class="grid-overlay"></div>
        <button class="debug-toggle" type="button" data-debug-toggle>Debug Grid</button>
        <div class="debug-panel" data-debug-panel>
            <div data-debug-info>Grid: --</div>
        </div>
        <section id="home">
            <div class="unselectable title"></div>
            <div class="unselectable centered selector">
                <a class="selector-card" href="design/" aria-label="Enter design portfolio">
                    <span class="selector-title">Design</span>
                    <span class="selector-sub">Art works, plugins, scripts</span>
                </a>
                <a class="selector-card" href="research/" aria-label="Enter research portfolio">
                    <span class="selector-title">Research</span>
                    <span class="selector-sub">Notes, publications</span>
                </a>
            </div>
        </section>
    </main>
    <footer>
        <p class="centered">&copy; 2025 XDzZyq. All rights reserved.</p>
    </footer>

    <script src="lib/gsap/gsap.min.js"></script>
    <script src="lib/gsap/ScrollTrigger.min.js"></script>
    <script src="lib/gsap/SplitText.min.js"></script>
    <script src="js/scrollbar.js"></script>
    <script type="module" src="js/title.js"></script>
    <script type="module" src="js/debug.js"></script>
</body>
</html>
