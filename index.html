<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XDzZyq | Select Home</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body class="layout">
    <main class="main">
        <div class="grid-overlay"></div>
        <section id="home">
            <div class="unselectable title">
                <img src="res/elem/sun.svg" class="centered sun" alt="Sun">
                <svg data-size="cir1" width="70" height="70" xmlns="http://www.w3.org/2000/svg" class="centered cir1">
                    <circle cx="35" cy="35" r="35" fill="white" />
                </svg>
                <svg data-size="arc" width="145" height="145" xmlns="http://www.w3.org/2000/svg" class="centered arc" aria-hidden="true">
                    <path class="arc-path" d="M0,72.5 A72.5,72.5 0 0,1 72.5,0"/>
                </svg>
                <svg data-size="cir2" width="35" height="35" xmlns="http://www.w3.org/2000/svg" class="centered cir2">
                    <circle cx="17.5" cy="17.5" r="17.5" fill="white" />
                </svg>
                <h1 class="centered xdzzyq">XDzZyq</h1>
                <div class="centered selector">
                    <a class="selector-card" href="design/" aria-label="Enter design portfolio">
                        <span class="selector-title">Design</span>
                        <span class="selector-sub">Art works, plugins, scripts</span>
                    </a>
                    <a class="selector-card" href="research/" aria-label="Enter research portfolio">
                        <span class="selector-title">Research</span>
                        <span class="selector-sub">Notes, publications</span>
                    </a>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p class="centered">© 2025 XDzZyq. All rights reserved.</p>
    </footer>

    <script src="dep/gsap-public/umd/gsap.js"></script>
    <script src="dep/gsap-public/umd/ScrollTrigger.js"></script>
    <script src="dep/gsap-public/umd/SplitText.js"></script>
    <script type="module" src="js/home.js"></script>
</body>
</html>
