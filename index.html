<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">
    <title> // __XDzZyq__</title>
</head>
<body class="`layout">
    <div class="title">
        <img src="res/elem/sun.png" class="unselectable sun" alt="Sun">
        <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg" class="centered cir1">
            <circle cx="40" cy="40" r="40" fill="white" />
        </svg>
        
        <img src="res/elem/arc.svg" class="unselectable centered arc" alt="Arc">

        
        <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg" class="centered cir2">
            <circle cx="20" cy="20" r="20" fill="white" />
        </svg>

        <h1 class="unselectable centered">XDzZyq</h1>
    </div>

    <script src="js/gsap.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const sun = document.querySelector('.sun');
            const arc = document.querySelector('.arc');
            const cir1 = document.querySelector('.cir1');
            const cir2 = document.querySelector('.cir2');
            const title = document.querySelector('h1');

            gsap.fromTo(sun, { opacity: 0 }, { opacity: 1, duration: 1 });
            gsap.fromTo(arc, { opacity: 0 }, { opacity: 1, duration: 1 });
            gsap.fromTo(cir1, { scale: 0 }, { scale: 1, duration: 1 });
            gsap.fromTo(cir2, { scale: 0 }, { scale: 1, duration: 1 });
            gsap.fromTo(title, { y: -50, opacity: 0 }, { y: 0, opacity: 1, duration: 1 });
        });
    </script>
</body>
</html>
