<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="site.title">Project | XDzZyq Research</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/research.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body class="research-page">
    <main class="research-main">
        <div class="research-shell">
            <nav class="research-nav" aria-label="Research navigation">
                <a class="research-brand" href="../" data-i18n="site.brand">XDzZyq</a>
                <div class="research-nav__links">
                    <a href="index.html#bio" data-i18n="nav.bio">Bio</a>
                    <a href="index.html#projects" data-i18n="nav.projects">Projects</a>
                    <a href="index.html#personal-projects" data-i18n="nav.personal">Personal</a>
                    <a href="index.html#notes" data-i18n="nav.notes">Notes</a>
                    <a href="index.html#publications" data-i18n="nav.publications">Publications</a>
                    <a href="index.html#contact" data-i18n="nav.contact">Contact</a>
                    <button type="button" class="nav-search-button" data-search-open aria-label="Search">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
                            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <span data-i18n="site.searchLabel">Search</span>
                        <kbd>/</kbd>
                    </button>
                    <a class="lang-switch" href="?lang=cn" data-lang-switch>
                        <span data-i18n="site.langLabel">EN</span>
                        <span class="lang-switch__sep" aria-hidden="true">/</span>
                        <span data-lang-switch-label>中</span>
                    </a>
                </div>
            </nav>

            <div data-project-root class="project-root">
                <p class="empty-state" data-i18n="projects.loading">Loading project...</p>
            </div>
        </div>
    </main>
    <footer class="site-footer">
        <p data-i18n="footer.copyright">&copy; 2026 XDzZyq. All rights reserved.</p>
    </footer>
    <div class="search-overlay" data-search-overlay hidden aria-hidden="true">
        <div class="search-backdrop" data-search-close></div>
        <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search">
            <div class="search-input-wrap">
                <svg class="search-input-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
                    <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input type="text" class="search-input" data-search-input autocomplete="off" spellcheck="false">
                <kbd class="search-input-kbd" data-search-close>Esc</kbd>
            </div>
            <ul class="search-results" data-search-results></ul>
            <p class="search-hint" data-i18n="site.searchHint">Press / or ⌘K to open search · Esc to close</p>
        </div>
    </div>
    <script type="module" src="js/i18n.js"></script>
    <script type="module" src="js/project.js"></script>
    <script type="module" src="js/search.js"></script>
</body>
</html>
